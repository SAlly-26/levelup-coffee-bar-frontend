<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito — Level Up Coffee Bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html">☕ Level Up Coffee Bar</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav" aria-controls="menuNav" aria-expanded="false" aria-label="Abrir navegación"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="menuNav"><ul class="navbar-nav ms-auto gap-2 align-items-lg-center">
<li class="nav-item"><a class="nav-link" href="tienda.html">Tienda</a></li>
<li class="nav-item"><a class="nav-link" href="menucafe.html">Menú</a></li>
<li class="nav-item"><a class="nav-link" href="contactanos.html">Contactanos</a></li>
<li class="nav-item"><a class="nav-link" href="#">Registrarse</a></li>
<li class="nav-item"><a class="nav-link btn btn-outline-info btn-sm px-3" href="carrito.html">🛒 Carrito <span id="cart-badge" class="badge bg-info text-dark ms-1">0</span></a></li>
</ul></div></div></nav>

    <main class="container seccion-carrito">
        <h2 class="mb-4 fw-bold">Tu Carrito</h2>

        <div id="vista-carrito">
            <div class="row g-4">

                <div class="col-lg-8">
                    <div id="lista-carrito">

                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card bg-dark border-secondary p-4">
                        <h5 class ="mb-3 fw-bold">Resumen del pedido</h5>

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary">Subtotal</span>
                            <span id="subtotal">$0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary">Envio</span>
                            <span id="text-success">Gratis</span>
                        </div>

                        <hr class="border-secondary">
                        <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
                            <span>Total</span>
                            <span id="total" class="text-info">$0</span>
                        </div>

                        <button class="btn btn-info w-100 fw-bold text-dark mb-2"
                                onclick="finalizarCompra()">
                            Finalizar Compra
                        </button>
                        <button class="btn btn-outline-danger w-100"
                                onclick="vaciarCarrito()">
                            Vaciar Carrito
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div id="carrito-vacio" class="text-center py-5 d-none">
            <p class="fs-1">🛒</p>
            <h4 class="fw-bold">Tu carrito está vacío</h4>
            <p class="text-secondary">¡Agrega productos desde la tienda!</p>
            <a href="index.html" class="btn btn-info mt-2 text-dark fw-bold">Ver Tienda</a>
        </div>
    </main>
    <footer class="site-footer"><div class="container">© 2024 Level Up Coffee Bar. Todos los derechos reservados.</div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
