<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito — Level Up Coffee Bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/carrito.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">☕ Level Up Coffee Bar</a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="promociones.html">Promociones</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Tienda</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Menú Café</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Registrarse</a></li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-info btn-sm px-3 active" href="carrito.html">
                            🛒 Carrito
                            <span id="cart-badge" class="badge bg-info text-dark ms-1">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <div class="container seccion-carrito">
        <h2 class="titulo-carrito">🛒 Tu Carrito</h2>

        <!-- Vista con productos -->
        <div id="vista-carrito">
            <div class="row g-4">

                <!-- Lista de items -->
                <div class="col-lg-8">
                    <div id="lista-carrito">
                        <!-- carrito.js inserta las tarjetas aquí -->
                    </div>
                </div>

                <!-- Resumen del pedido -->
                <div class="col-lg-4">
                    <div class="card-resumen">
                        <h5 class="resumen-titulo">Resumen del pedido</h5>

                        <div class="resumen-fila">
                            <span>Subtotal</span>
                            <span id="subtotal">$0</span>
                        </div>
                        <div class="resumen-fila">
                            <span>Envío</span>
                            <span class="resumen-envio">Gratis 🎉</span>
                        </div>
                        <div class="resumen-fila total">
                            <span>Total</span>
                            <span id="total">$0</span>
                        </div>

                        <button class="btn-finalizar" onclick="finalizarCompra()">
                            Finalizar Compra ✓
                        </button>
                        <button class="btn-vaciar" onclick="vaciarCarrito()">
                            Vaciar Carrito 🗑️
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Vista carrito vacío -->
        <div id="carrito-vacio" class="carrito-vacio d-none">
            <p class="carrito-vacio-icon">🛒</p>
            <h4>Tu carrito está vacío</h4>
            <p>¡Agrega productos desde la tienda!</p>
            <a href="index.html" class="btn-ver-tienda">Ver Tienda</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
